# ============================================================================
# DEMO app using Micrometer (Spring Boot) that PUSHES OTLP metrics to the collector.
# Used to reproduce the PER-INSTANCE duplication that the adservice demo
# (OpenTelemetry SDK, sticky connection) does NOT show.
#
# Why Micrometer duplicates and the OTel SDK does not - VERIFIED via A/B: the
# duplication persists even WITHOUT any JVM keep-alive flag, so it is NOT a config
# artifact.
#   - Micrometer publishes on a schedule and, in practice, opens a NEW HTTP connection
#     per push; kube-proxy (per-connection balancing on the ClusterIP) may route it to a
#     different replica each time => the SAME logical series (same service.name) is
#     re-exposed by MULTIPLE collector instances (duplication).
#   - The OTel SDK reuses ONE keep-alive connection => sticky on one replica => no
#     duplication (behaves like the gRPC case you tested).
#
# PREREQUISITES:
#   - Namespace app-ns: created by ../app/01-app.yaml (apply it first, or uncomment the
#     Namespace block below for a standalone file).
#   - A collector with >= 2 replicas (scale it, or HPA enabled in prod).
#   - Build & push the reference app image (./reference-app) FORCING the node arch (your
#     nodes are amd64, your Mac is arm64), then set it in the image field. Cross-arch, no qemu:
#       cd reference-app
#       podman build --platform=linux/amd64 -t <REGISTRY>/<NS>/micrometer-otlp-demo:1.0.0 .
#       podman push    <REGISTRY>/<NS>/micrometer-otlp-demo:1.0.0
#     After re-pushing under the SAME tag, force a re-pull on the node:
#       oc rollout restart deployment/sample-micrometer-app -n app-ns
#     (or use a unique tag; imagePullPolicy is Already Always below).
#
# SWITCH the target collector: edit MANAGEMENT_OTLP_METRICS_EXPORT_URL (single vs dual),
# see the commented alternative in env below.
#
# VERIFICATION (dual-layer stack). After applying otel-collector-l1l2 and pointing the app
# to L1 (otel-edge in otel-l1l2-ns), L1 routes by hash(k8s.pod.name,k8s.namespace.name) to
# L2 (otel-agg), so the SAME app pod must appear on ONLY ONE L2 replica => NO duplication.
# The metric grows only when you invoke the app (no auto-increment).
#   1) port-forward the app gRPC Service:
#        oc port-forward svc/sample-micrometer-app-service 9555:9555 -n app-ns
#   2) invoke GetAds N times (using the .proto):
#        for i in $(seq 1 50); do \
#          grpcurl -plaintext -import-path reference-app/src/main/proto -proto rpc_ping.proto \
#            -d '{"count":1}' localhost:9555 micrometerdemo.AdService/GetAds ; done
#   3) check the L2 replicas (otel-agg): the app series must live on 1 instance only.
#        oc get pods -n otel-l1l2-ns -l app.kubernetes.io/instance=otel-agg -o wide
#        oc run metrics-curl -n otel-l1l2-ns --rm -i --restart=Never --image=curlimages/curl:8.8.0 \
#          -- sh -c 'for ip in <L2_IP_1> <L2_IP_2>; do echo "-- $ip"; \
#            curl -s http://$ip:8889/metrics | grep "rpc_server_duration_milliseconds_count{.*micrometer"; done'
#      Expected: the line appears on ONE ip only (not on both) => duplication eliminated.
---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: app-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-micrometer-app
  namespace: app-ns
  labels:
    app: sample-micrometer-app
spec:
  replicas: 1              # 1 app pod is enough: the scatter is PER-PUSH (new connection per push)
                           # and the metric grows only when you INVOKE GetAds (no auto-increment)
  selector:
    matchLabels:
      app: sample-micrometer-app
  template:
    metadata:
      labels:
        app: sample-micrometer-app
    spec:
      containers:
      - name: app-container
        image: quay.io/asatrian/micrometer-otlp-demo:1.0.0   # built from ./reference-app with --platform=linux/amd64
        imagePullPolicy: Always   # force re-pull: avoids the node keeping a cached arm64 image
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9555
          name: grpc            # name 'grpc': signals the OpenShift router that this is HTTP/2 (like ../app)
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        env:
        # 1. Collector OTLP/HTTP endpoint (Micrometer needs the FULL URL incl. /v1/metrics).
        #    Enable ONE (default = single-layer):
        # - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
        #   value: "http://otel-collector.otel-ns.svc.cluster.local:4318/v1/metrics"
        #    dual-layer (otel-edge L1 in otel-l1l2-ns): comment the block above, uncomment this:
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
          value: "http://otel-edge-collector.otel-l1l2-ns.svc.cluster.local:4318/v1/metrics"

        # 2. Publish interval (a new push every 10s -> new balancing decision)
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
          value: "10s"

        # 3. Explicitly enable OTLP export
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          value: "true"

        # 4. Resource attribute -> becomes the UWM label service_name
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_RESOURCE_ATTRIBUTES_SERVICE_NAME
          value: "micrometer-push-demo"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-micrometer-app-service
  namespace: app-ns
  labels:
    app: sample-micrometer-app
spec:
  type: ClusterIP
  selector:
    app: sample-micrometer-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9555
    targetPort: 9555
    protocol: TCP
