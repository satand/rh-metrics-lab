server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Temporale CUMULATIVA: allinea il comportamento ai contatori/istogrammi OTLP
# visti in prod (un contatore cumulativo e' cio' che si duplica tra repliche).
management.otlp.metrics.export.aggregation-temporality=cumulative

# Attributi di resource OTLP -> diventano label su UWM (service_name).
# URL/step/temporality vengono passati via env nel Deployment.
management.otlp.metrics.export.resource-attributes.service.name=micrometer-push-demo
management.otlp.metrics.export.resource-attributes.service.namespace=app-ns

# Timer come ISTOGRAMMA a bucket espliciti -> su UWM:
# rpc_server_duration_milliseconds_{count,sum,bucket} (come l'istogramma del demo adservice;
# Micrometer/OTLP riporta le durate in millisecondi). La metrica cresce SOLO a ogni
# invocazione gRPC GetAds (nessun auto-increment).
management.metrics.distribution.percentiles-histogram.rpc.server.duration=true

# Porta del server gRPC (default 9555, come il Service di ../app).
grpc.server.port=9555

# Tag applicativi costanti aggiunti a tutte le metriche.
management.metrics.tags.rpc.system=grpc
