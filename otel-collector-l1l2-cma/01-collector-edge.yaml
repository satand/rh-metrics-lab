# ============================================================================
# L1 - otel-edge  (EDGE / deterministic router)   [dual-layer + CMA stack, ns otel-l1l2-ns]
# - Receives OTLP/HTTP :4318 from the applications.
# - Runs k8sattributes + filters + transform HERE (the 'connection' is the app pod).
# - Routes to L2 with the loadbalancing exporter hashing on k8s.pod.name +
#   k8s.namespace.name: the same app pod ALWAYS goes to the same L2 replica => no duplication.
# - Does NOT expose a prometheus exporter: UWM scrapes no application data from here.
#   Only the self-metrics ServiceMonitor (otelcol_*) stays, via enableMetrics.
#
# CMA variant differences vs otel-collector-l1l2/:
#   - memory_limiter ENABLED (first processor) -> generates 'refused' backpressure and a
#     bounded memory ceiling; REQUIRES spec.resources.limits.memory.
#   - spec.resources.limits set -> so container_memory_working_set_bytes % of limit works.
#   - spec.autoscaler intentionally ABSENT: replicas are owned by CMA/KEDA ScaledObject
#     (see 04-so-otel-edge.yaml). Do NOT enable the operator autoscaler together with CMA.
#
# REQUIREMENT: the collector image must bundle the 'loadbalancing' exporter
# (otelcol-contrib / otelcol-k8s distributions). If the image in use (service.name
# 'otelcol') lacks it, set spec.image to otelcol-contrib.
# Verify after apply: oc get servicemonitor -n otel-l1l2-ns  (L1 must have ONLY self-metrics)
# ============================================================================
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-edge
  namespace: otel-l1l2-ns
spec:
  networkPolicy:
    enabled: true
  observability:
    metrics:
      enableMetrics: true          # self-metrics on :8888 (otelcol_*, incl. loadbalancer_*)
  deploymentUpdateStrategy: {}
  httpRoute:
    enabled: false
    gateway: ''
  config:
    exporters:
      loadbalancing:               # 0.158: name 'loadbalancing' ('load_balancing' is the new name)
        routing_key: attributes
        routing_attributes:
          - k8s.pod.name
          - k8s.namespace.name
        # routing_key: resource    # Alternative to routing_key: attributes and its associated routing_attributes field
        protocol:
          otlp:
            tls:
              insecure: true       # L2 exposes plain OTLP/gRPC
            timeout: 5s
            retry_on_failure:
              enabled: true
              initial_interval: 5s
              max_interval: 30s
              max_elapsed_time: 300s
            sending_queue:
              enabled: true
              num_consumers: 10
            # CMA note: keep the otlp sending_queue enabled (default) for L1->L2 backpressure.
            # Its otelcol_exporter_queue_* metrics are NOT exposed by the loadbalancing
            # helper_exporter, so the edge scaler keys on otelcol_exporter_in_flight_requests.
        resolver:
          dns:
            hostname: otel-agg-collector-headless   # operator auto-creates <name>-collector-headless (resolves to L2 pod IPs)
            port: "4317"
            interval: 5s           # re-resolves the ring quickly when L2 scales
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80        # soft ceiling = 80% of the container memory limit
        spike_limit_percentage: 25  # reduce to (80-25)% when a spike is in flight
      batch:
        send_batch_max_size: 0
        send_batch_size: 8192
        timeout: 10s
      filter/metrics:
        error_mode: ignore
        metrics:
          metric:
            - instrumentation_scope.name == "io.opentelemetry.runtime-telemetry-java8"
            - instrumentation_scope.name == "io.opentelemetry.exporters.otlp-http"
            - instrumentation_scope.name == "io.opentelemetry.sdk.logs"
            - instrumentation_scope.name == "io.opentelemetry.sdk.trace"
      k8sattributes:
        extract:
          metadata:
            - k8s.node.name
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection
        watch_sync_period: 30s
      transform:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - 'set(attributes["k8s.workload.kind"], "replicaset") where IsString(attributes["k8s.replicaset.name"])'
              - 'set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where IsString(attributes["k8s.replicaset.name"])'
              - 'set(attributes["k8s.workload.kind"], "deployment") where IsString(attributes["k8s.deployment.name"])'
              - 'set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where IsString(attributes["k8s.deployment.name"])'
              - 'delete_key(attributes, "k8s.deployment.name")'
      transform/clean_resource:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              # Keep ONLY the attributes needed to identify service and K8s infrastructure
              - keep_keys(attributes, ["service.name", "k8s.namespace.name", "k8s.pod.name", "k8s.node.name", "k8s.workload.kind", "k8s.workload.name"])
    receivers:
      otlp:
        protocols:
          http:
            endpoint: '0.0.0.0:4318'
    service:
      pipelines:
        metrics/push:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/metrics
            - k8sattributes
            - transform
            - transform/clean_resource
            - batch
          exporters:
            - loadbalancing
      telemetry:
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_scope_info: false
                    without_type_suffix: false
                    without_units: false
  mode: deployment
  headlessService: false
  replicas: 2                       # base replicas; CMA/KEDA ScaledObject owns min/max
  # NOTE: do NOT set spec.autoscaler here (CMA owns scaling). resources below enable both
  # the memory_limiter ceiling and the Fase1 'memory % of limit' autoscaling signal.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  managementState: managed
  upgradeStrategy: automatic
  ingress:
    route: {}
  podDnsConfig: {}
  daemonSetUpdateStrategy: {}
  serviceAccount: otel-collector-sa
  ipFamilyPolicy: SingleStack
  configVersions: 3
