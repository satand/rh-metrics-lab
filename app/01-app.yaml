apiVersion: v1
kind: Namespace
metadata:
  name: app-ns
  # labels:
  #   openshift.io/user-monitoring: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-otel-app
  namespace: app-ns
  labels:
    app: sample-otel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-otel-app
  template:
    metadata:
      labels:
        app: sample-otel-app
    spec:
      containers:
      - name: app-container
        image: ghcr.io/open-telemetry/demo:1.10.0-adservice
        ports:
        - containerPort: 9555
          name: grpc
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        env:
        # 0. gRPC server port
        - name: AD_SERVICE_PORT
          value: "9555"
        # 1. OTLP protocol
        # Force OTLP/HTTP instead of gRPC
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"

        # 2. Collector OTLP endpoint (port 4318). Enable ONE (default = single-layer):
        #    single-layer: the original 'otel' CR service in otel-ns
        # - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #   value: "http://otel-collector.otel-ns.svc.cluster.local:4318"
        #    dual-layer: the L1 'otel-edge' service in otel-l1l2-ns
        #    (comment the block above, uncomment the two lines below):
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-edge-collector.otel-l1l2-ns.svc.cluster.local:4318"

        # 3. Metadata / SDK configuration
        - name: OTEL_SERVICE_NAME
          value: "adservice-demo"

        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"

        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"

        - name: OTEL_PROPAGATORS
          value: "tracecontext,baggage"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-otel-app-service
  namespace: app-ns
  labels:
    app: sample-otel-app
spec:
  type: ClusterIP
  selector:
    app: sample-otel-app
  ports:
  - name: grpc              # The name 'grpc' tells the OpenShift router this is HTTP/2
    port: 9555              # Service port
    targetPort: 9555        # gRPC port exposed by the adservice container
    protocol: TCP
